spring:
  application:
    name: myapp
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/demo?useSSL=false&serverTimezone=UTC
    username: root
    password: root
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall,slf4j
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=2000
rocketmq:
  name-server: 192.168.146.100:9876
  producer:
     group: async-log-producer
     send-message-timeout: 3000
     compress-message-body-threshold: 4096
     retry-times-when-send-failed: 2

mybatis:
  mapper-locations: classpath:mapper/*.xml
minio:
  endpoint: http://192.168.146.100:9000
  access-key: minio
  secret-key: Minio@123
  bucket: 264

