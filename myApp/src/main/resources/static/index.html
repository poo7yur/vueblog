<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的图片收藏站</title>
    <!-- 引入 Font Awesome 图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 顶部 -->
<header>
    <h1>我的图片收藏站</h1>
    <!-- 右上角用户图标 + 下拉窗 -->
    <div class="user-box">
        <div class="user-icon" id="userIcon" title="我的">
            <i class="fas fa-user-circle"></i>
        </div>
        <ul class="user-menu" id="userMenu">
            <li><a href="#login" id="loginLink">登录</a></li>
            <li><a href="#register" id="registerLink">注册</a></li>
            <li><a href="#space" id="spaceLink">空间</a></li>
            <li><a href="#msg" id="msgLink">消息</a></li>
            <li><a href="#" id="logout">退出</a></li>
        </ul>
    </div>
</header>

<!-- 消息弹窗 -->
<div class="msg-modal" id="msgModal">
    <div class="msg-modal-content">
        <span class="close-btn" id="closeMsgModal">&times;</span>
        <div>
            <label for="searchKeyword"></label><input type="text" id="searchKeyword" placeholder="输入关键词搜索" />
            <button onclick="searchMessages()">搜索</button>
        </div>
        <table id="msgTable">
            <thead>
            <tr>
                <th>消息ID</th>
                <th>内容</th>
                <th>时间</th>
                <th>创建者</th>
                <th>群组</th>
                <th>类型</th>
            </tr>
            </thead>
            <tbody id="msgTableBody"></tbody>
        </table>
        <!-- 分页区域 -->
        <div id="pagination" style="margin-top: 20px; text-align: center;">
            <!-- 分页按钮将由 JS 动态生成 -->
        </div>
    </div>
</div>

<!-- 注册悬浮弹窗（默认隐藏） -->
<div class="register-modal-mask" id="registerModalMask">
    <div class="register-modal">
        <span class="close-btn" id="closeRegModal">&times;</span>
        <h3>用户注册</h3>
        <div class="register-form-item">
            <label for="regUsername">用户名</label>
            <input type="text" id="regUsername" placeholder="请输入用户名">
        </div>
        <div class="register-form-item">
            <label for="regPassword">密码</label>
            <input type="password" id="regPassword" placeholder="请输入密码">
        </div>
        <div class="register-form-item">
            <label for="regEmail">邮箱</label>
            <input type="email" id="regEmail" placeholder="请输入邮箱">
        </div>
        <div class="register-form-item">
            <label for ="regPhone">手机号</label>
            <input type="text" id="regPhone" placeholder="请输入手机号">
        </div>
        <button class="register-btn" id="registerBtn">注册</button>
    </div>
</div>

<!-- 登录悬浮弹窗（默认隐藏） -->
<div class="login-modal-mask" id="loginModalMask">
    <div class="login-modal">
        <h3>用户登录</h3>
        <div class="login-form-item">
             <label for="username">用户名</label>
             <input type="text" id="username" placeholder="请输入用户名" value="adm">
        </div>
        <div class="login-form-item">
             <label for="password">密码</label>
             <input type="password" id="password" placeholder="请输入密码" value="adm">
        </div>
        <button class="login-btn" id="loginBtn">登录</button>
        <div class="close-modal" id="closeModal">取消</div>
   </div>
</div>

<div class="container">
    <!-- 左侧导航栏 -->
    <nav class="sidebar">
        <div id="treeContainer"></div>
    </nav>

    <!-- 右侧内容展示区 -->
    <main class="content" id="contentArea">
        <p>点击左侧树浏览...</p>
    </main>
</div>

<script src="script.js"></script>
</body>
</html>
