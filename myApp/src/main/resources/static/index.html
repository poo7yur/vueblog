<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的图片收藏站</title>
    <!-- 引入 Font Awesome 图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 顶部 -->
<header>
    <h1>我的图片收藏站</h1>
    <!-- 右上角用户图标 + 下拉窗 -->
    <div class="user-box">
        <div class="user-icon" id="userIcon" title="我的">
            <i class="fas fa-user-circle"></i>
        </div>
        <ul class="user-menu" id="userMenu">
            <li><a href="#login" id="loginLink">登录</a></li>
            <li><a href="#register" id="registerLink">注册</a></li>
            <li><a href="#space">空间</a></li>
            <li><a href="#msg">消息</a></li>
        </ul>
    </div>
</header>

<!-- 登录悬浮弹窗（默认隐藏） -->
<div class="login-modal-mask" id="loginModalMask">
    <div class="login-modal">
        <h3>用户登录</h3>
        <div class="login-form-item">
            <label for="username">用户名</label>
            <input type="text" id="username" placeholder="请输入用户名" value="adm">
        </div>
        <div class="login-form-item">
            <label for="password">密码</label>
            <input type="password" id="password" placeholder="请输入密码" value="adm">
        </div>
        <button class="login-btn" id="loginBtn">登录</button>
        <div class="close-modal" id="closeModal">取消</div>
    </div>
</div>

<div class="container">
    <!-- 左侧导航栏 -->
    <nav class="sidebar">
        <div id="treeContainer"></div>
    </nav>

    <!-- 右侧内容展示区 -->
    <main class="content" id="contentArea">
        <p>点击左侧树浏览...</p>
    </main>
</div>

<script src="script.js"></script>
</body>
</html>
